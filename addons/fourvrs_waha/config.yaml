name: 4VRS WhatsApp (WAHA)
version: "0.3.0"
slug: fourvrs_waha
image: ghcr.io/dk-1983/{arch}-addon-fourvrs_waha
description: WhatsApp QR pairing and HTTP API using WAHA Core
url: https://github.com/dk-1983/4vrs-waha-addon
arch:
  - amd64
startup: application
boot: auto
init: true
timeout: 120
backup: cold
webui: http://[HOST]:[PORT:3000]/dashboard/
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Authenticated WAHA API and dashboard
options:
  api_key: ""
  dashboard_auth_enabled: true
  dashboard_username: admin
  dashboard_password: ""
  log_level: warn
  proxy_enabled: false
  proxy_url: ""
  proxy_username: ""
  proxy_password: ""
schema:
  api_key: password
  dashboard_auth_enabled: bool
  dashboard_username: str
  dashboard_password: password
  log_level: list(warn|error)
  proxy_enabled: bool
  proxy_url: str
  proxy_username: str
  proxy_password: password
watchdog: tcp://[HOST]:[PORT:3000]
