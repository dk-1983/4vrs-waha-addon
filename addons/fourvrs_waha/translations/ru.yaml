configuration:
  api_key:
    name: Ключ API
    description: Задайте секретный случайный ключ длиной от 16 символов. Укажите тот же ключ в интеграции домофона. Не используйте префикс sha512.
  dashboard_username:
    name: Пользователь панели
    description: Логин панели WAHA и документации API. По умолчанию admin.
  dashboard_password:
    name: Пароль панели
    description: Задайте отдельный пароль длиной от 16 символов для защиты панели привязки по QR-коду.
  log_level:
    name: Уровень журнала
    description: Уровень диагностики WAHA — предупреждения или ошибки. Оболочка не включает подробное журналирование сообщений.
  proxy_enabled:
    name: Использовать прокси для WhatsApp
    description: Отдельный переключатель исходящего трафика WhatsApp в WAHA. Выключен — прямое соединение. Не настраивает скачивание Docker-образов и подключение к локальному API.
  proxy_url:
    name: Адрес прокси
    description: http://адрес:порт, https://адрес:порт или socks5://адрес:порт. Без логина и пароля в адресе. SOCKS5 с авторизацией не поддерживается Chromium. Удалите отдельные настройки прокси сессии в панели WAHA.
  proxy_username:
    name: Пользователь прокси
    description: Необязательный логин для HTTP/HTTPS-прокси. Для работы без авторизации оставьте оба поля учётных данных пустыми.
  proxy_password:
    name: Пароль прокси
    description: Пароль HTTP/HTTPS-прокси. В этом поле Supervisor сохраняется фактическое значение; пустое поле означает отсутствие пароля.
network:
  3000/tcp: API WAHA и панель привязки по QR-коду. Только доверенная локальная сеть; не публикуйте порт напрямую в интернете.
